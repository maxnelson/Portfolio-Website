runtime: nodejs22
env: standard
instance_class: F1

automatic_scaling:
    max_instances: 1

handlers:
    - url: /assets
      static_dir: dist/assets

    - url: /
      static_files: dist/index.html
      upload: dist/index.html

    - url: /.*
      script: auto

env_variables:
    NODE_ENV: "production"
